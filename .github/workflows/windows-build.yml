name: Windows portable
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a prerelease after all checks pass'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  portable:
    needs: quality
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
      - shell: pwsh
        run: ./scripts/build_windows.ps1 -Commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: CoreDescriptionW2E-windows-x64
          path: |
            dist/CoreDescriptionW2E-v*-windows-x64.zip
            dist/CoreDescriptionW2E-v*-windows-x64.zip.sha256
            dist/manifest.json
          if-no-files-found: error
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CoreDescriptionW2E-windows-x64
          path: release-files
      - name: Publish verified prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("release-files/manifest.json"))["version"])')
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag/version mismatch"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace"; exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$tag" ]] && git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists; dispatch refuses to reuse or move it"; exit 1
          fi
          gh release create "$tag" release-files/*.zip release-files/*.sha256 release-files/manifest.json --target "$GITHUB_SHA" --prerelease --title "CoreDescriptionW2E $tag (предварительная версия)" --notes-file docs/RELEASE_NOTES.md
