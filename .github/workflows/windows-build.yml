name: Windows portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'New production release, or diagnostic only (no tag/release)'
        type: choice
        options: [diagnostic, production]
        default: diagnostic
permissions:
  contents: read
# The slot covers allocation through publication. PR/diagnostic runs are independent.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'production')) && 'windows-production-release' || format('windows-diagnostic-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
env:
  BUILD_MODE: ${{ inputs.mode || 'production' }}
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  portable:
    needs: quality
    runs-on: windows-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      production: ${{ steps.plan.outputs.production }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Allocate after fresh tag and release inventory
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/release.py plan
      - shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.plan.outputs.version }}
        run: ./scripts/build_windows.ps1 -Commit $env:GITHUB_SHA -Version $env:BUILD_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: CoreDescriptionW2E-windows-x64
          path: |
            dist/CoreDescriptionW2E-v*-windows-x64.zip
            dist/CoreDescriptionW2E-v*-windows-x64.zip.sha256
            dist/manifest.json
          if-no-files-found: error
  publish:
    if: needs.portable.outputs.production == 'true'
    needs: [quality, portable]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      BUILD_VERSION: ${{ needs.portable.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: CoreDescriptionW2E-windows-x64
          path: release-files
      - name: Verify downloaded ZIP, metadata and unpacked frozen EXE again
        shell: pwsh
        run: |
          uv run python scripts/release.py verify --folder release-files --version $env:BUILD_VERSION --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Bundle verification failed" }
          ./scripts/verify_windows.ps1 -Archive "release-files/CoreDescriptionW2E-v$env:BUILD_VERSION-windows-x64.zip" -Version $env:BUILD_VERSION
      - name: Create unique annotated tag, verify draft assets, publish and download
        run: uv run python scripts/release.py publish --folder release-files --version $env:BUILD_VERSION --commit $env:GITHUB_SHA
