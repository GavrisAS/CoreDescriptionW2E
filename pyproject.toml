[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coredescriptionw2e"
version = "0.1.0"
description = "Offline Word core descriptions to Excel template converter"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
  "PySide6-Essentials>=6.10,<7",
  "olefile==0.47",
  "defusedxml>=0.7.1,<1",
]

[project.scripts]
coredescriptionw2e = "coredescriptionw2e.cli:main"

[project.gui-scripts]
coredescriptionw2e-gui = "coredescriptionw2e.gui.app:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<1",
  "ty>=0.0.85,<1",
  "pyinstaller>=6.16,<7",
  "types-lxml>=2026.2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coredescriptionw2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"
